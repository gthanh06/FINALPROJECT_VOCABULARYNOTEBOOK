# render.yaml — Render Blueprint: one Docker web service, HTTPS is provided by Render.
# DATABASE_URL (Supabase connection string) is a secret: sync: false means Render
# asks for it in the dashboard and it never lives in Git.
services:
  - type: web
    name: vocab-notebook
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      # The admin account is created / reset from these at every start (app/migrate.py).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ENV
        value: production
      # AI: the key is a secret typed in the dashboard; the model can be changed here.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
