<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabulary Notebook</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EAa%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <span class="logo" aria-hidden="true">Aa</span>
        <span>Vocabulary Notebook</span>
      </a>
      <nav data-nav-links hidden>
        <a href="#/" data-nav="list">Words</a>
        <a href="#/notebook" data-nav="notebook">My notebook</a>
        <a href="#/review" data-nav="review">Practice</a>
        <a href="#/quiz" data-nav="quiz">Quiz</a>
        <a href="#/srs" data-nav="srs">Review today</a>
        <a href="#/progress" data-nav="progress">Progress</a>
        <a href="#/admin" data-nav="admin" data-admin-only hidden>Admin</a>
      </nav>
      <div class="user" data-user hidden>
        <span class="avatar" data-avatar aria-hidden="true"></span>
        <span class="user-name" data-user-name></span>
        <button class="btn small ghost" data-logout>Log out</button>
      </div>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>
  <div id="toast" role="status" hidden></div>

  <!-- Log in / Sign up (one shared form) -->
  <template id="tpl-auth">
    <section class="auth">
      <div class="card auth-card">
        <a class="admin-pill" href="#/admin-login" data-admin-link>🔒 Admin</a>
        <span class="logo lg" aria-hidden="true">Aa</span>
        <h1 data-auth-title></h1>
        <p class="muted" data-auth-subtitle></p>
        <div class="tabs" role="tablist" data-auth-tabs>
          <a href="#/login" data-tab="login">Log in</a>
          <a href="#/register" data-tab="register">Sign up</a>
        </div>
        <form class="form" data-auth-form novalidate>
          <label data-name-field><span>Display name</span>
            <input name="display_name" maxlength="60" autocomplete="name" placeholder="e.g. Gia Thanh">
          </label>
          <label><span>Email</span>
            <input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com">
          </label>
          <label><span>Password</span>
            <span class="password">
              <input name="password" type="password" required maxlength="128" placeholder="At least 8 characters">
              <button type="button" class="btn small ghost" data-toggle-password>Show</button>
            </span>
          </label>
          <p class="error" data-error hidden></p>
          <button class="btn primary lg block" type="submit" data-submit></button>
        </form>
        <p class="muted switch" data-switch></p>
      </div>
    </section>
  </template>

  <!-- Word list -->
  <template id="tpl-list">
    <section>
      <div class="hero">
        <div>
          <h1>Word bank</h1>
          <p class="muted">Browse the words by topic, listen to them and practice every day.</p>
        </div>
        <div class="hero-actions">
          <a class="btn primary" href="#/review">Practice now</a>
        </div>
      </div>

      <div class="stats" data-stats></div>

      <div class="row topics-head">
        <h2>Topics</h2>
        <a class="btn small" data-review-topic hidden></a>
      </div>
      <div class="topics" data-topics role="group" aria-label="Choose a topic"></div>

      <div class="toolbar">
        <form class="search" data-search role="search">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" name="q" placeholder="Search by word or meaning..." aria-label="Search" autocomplete="off">
        </form>
        <select data-pos aria-label="Part of speech"></select>
        <select data-sort aria-label="Sort">
          <option value="new">Newest</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
      </div>

      <p class="muted count" data-count></p>
      <ul class="words" data-words></ul>
      <div class="row center">
        <button class="btn" data-more hidden>Show more</button>
      </div>
    </section>
  </template>

  <!-- Add / Edit (one shared form) -->
  <template id="tpl-form">
    <section class="narrow">
      <a class="back" href="#/admin">← Admin</a>
      <h1 data-title></h1>
      <form class="card form" data-form>
        <div class="grid-2">
          <label><span>English word <span class="req">*</span></span>
            <input name="word" required maxlength="100" autocomplete="off" placeholder="e.g. persevere">
          </label>
          <label>Part of speech
            <select name="part_of_speech">
              <option value="">— choose —</option>
              <option value="noun">noun</option>
              <option value="verb">verb</option>
              <option value="adjective">adjective</option>
              <option value="adverb">adverb</option>
              <option value="preposition">preposition</option>
              <option value="conjunction">conjunction</option>
              <option value="pronoun">pronoun</option>
              <option value="phrase">phrase</option>
            </select>
          </label>
        </div>
        <label><span>Topic</span>
          <select name="topic_id" data-topic-select></select>
        </label>
        <label><span>Vietnamese meaning <span class="req">*</span></span>
          <input name="meaning_vi" required autocomplete="off" placeholder="e.g. kiên trì">
        </label>
        <label>Example sentence
          <textarea name="example" rows="2" placeholder="e.g. You must persevere to learn a language."></textarea>
        </label>
        <label>Usage note
          <textarea name="usage_note" rows="3" placeholder="e.g. persevere with / in sth"></textarea>
        </label>
        <p class="error" data-error hidden></p>
        <div class="row end">
          <a class="btn ghost" href="#/admin">Cancel</a>
          <button class="btn primary" type="submit" data-submit>Save</button>
        </div>
      </form>
    </section>
  </template>

  <!-- My notebook: the logged-in user's own words -->
  <template id="tpl-notebook">
    <section>
      <div class="hero">
        <div>
          <h1>My notebook</h1>
          <p class="muted">Your personal vocabulary: add new words or save words from the shared bank.</p>
        </div>
        <div class="hero-actions">
          <a class="btn" href="#/">Get from word bank</a>
          <a class="btn" href="#/notebook/suggest">✨ Suggest words</a>
          <a class="btn" href="#/notebook/sentence">✍️ Write a sentence</a>
          <a class="btn" href="#/notebook/chat">💬 Conversation practice</a>

          <a class="btn" href="#/quiz">Notebook quiz</a>
          <a class="btn" href="#/srs">Review today</a>

          <a class="btn primary" href="#/notebook/new">+ Add a word</a>
        </div>
      </div>
      <div class="toolbar">
        <form class="search" data-search role="search">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" name="q" placeholder="Search by word or meaning..." aria-label="Search" autocomplete="off">
        </form>
        <select data-sort aria-label="Sort">
          <option value="new">Newest</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
      </div>
      <p class="muted count" data-count></p>
      <ul class="words" data-words></ul>
      <div class="row center">
        <button class="btn" data-more hidden>Show more</button>
      </div>
    </section>
  </template>

  <!-- My notebook: add / edit one of my words -->
  <template id="tpl-notebook-form">
    <section class="narrow">
      <a class="back" href="#/notebook">← My notebook</a>
      <h1 data-title></h1>
      <form class="card form" data-form novalidate>
        <div class="grid-2">
          <div class="ai-word">
            <label><span>English word <span class="req">*</span></span>
              <input name="word" required maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="vd: resilient">
            </label>
            <button type="button" class="btn ai-btn" data-ai-fill>✨ Fill with AI</button>
          </div>
          <label>Part of speech
            <select name="part_of_speech" data-pos-select></select>
          </label>
        </div>
        <p class="muted small hint-line" data-ai-hint>Enter a word and click <strong>✨ Fill with AI</strong>: AI will suggest the meaning, pronunciation, examples, and more for you to review before saving.</p>
        <div class="ai-panel" data-ai-panel role="status" aria-live="polite" hidden></div>
        <div class="grid-2">
          <label><span>Vietnamese meaning <span class="req">*</span></span>
            <input name="meaning_vi" required maxlength="300" autocomplete="off" placeholder="vd: kiên cường, mau phục hồi">
          </label>
          <label>IPA pronunciation
            <input name="ipa" maxlength="100" autocomplete="off" spellcheck="false" placeholder="vd: /rɪˈzɪliənt/">
          </label>
        </div>
        <label>English definition
          <textarea name="definition_en" rows="2" maxlength="500" placeholder="vd: able to recover quickly from difficulties"></textarea>
        </label>
        <fieldset class="examples-field">
          <legend>Example sentences</legend>
          <div class="example-row">
            <textarea name="example_en_0" rows="2" maxlength="300" placeholder="English sentence"></textarea>
            <textarea name="example_vi_0" rows="2" maxlength="300" placeholder="Vietnamese translation"></textarea>
          </div>
          <div class="example-row">
            <textarea name="example_en_1" rows="2" maxlength="300" placeholder="English sentence"></textarea>
            <textarea name="example_vi_1" rows="2" maxlength="300" placeholder="Vietnamese translation"></textarea>
          </div>
        </fieldset>
        <div class="grid-3">
          <label>Synonyms
            <input name="synonyms" autocomplete="off" placeholder="tough, hardy">
          </label>
          <label>Antonyms
            <input name="antonyms" autocomplete="off" placeholder="fragile">
          </label>
          <label>Collocations
            <input name="collocations" autocomplete="off" placeholder="remarkably resilient">
          </label>
        </div>
        <p class="muted small hint-line">Separate multiple items with commas.</p>
        <label>Usage note
          <textarea name="usage_note" rows="2" maxlength="1000" placeholder="vd: resilient to sth"></textarea>
        </label>
        <label><span>Topic</span>
          <select name="topic_id" data-topic-select></select>
        </label>
        <p class="error" data-error hidden></p>
        <div class="row end">
          <a class="btn ghost" href="#/notebook">Cancel</a>
          <button class="btn primary" type="submit" data-submit>Save to notebook</button>
        </div>
      </form>
    </section>
  </template>

  <!-- Luyện hội thoại: an English chat with an AI tutor that uses the learner's notebook words -->
  <template id="tpl-chat">
    <section class="narrow">
      <a class="back" href="#/notebook">← My notebook</a>
      <h1>Conversation practice</h1>
      <p class="muted">Chat in English with an AI tutor using words from your notebook. The tutor will encourage you to reuse them and gently correct mistakes.</p>
      <div data-chat-body>
        <div class="card chat-words">
          <div class="row">
            <span class="chips-label">Words to practice</span>
            <button class="btn small" type="button" data-new-words>🔀 Change words</button>
          </div>
          <div class="chips" data-chat-words></div>
          <p class="muted small" data-chat-score></p>
        </div>
        <div class="chat-log" data-chat-log aria-live="polite"></div>
        <form class="chat-form" data-form novalidate>
          <textarea name="message" rows="2" maxlength="500" lang="en" placeholder="Write in English… (Enter to send, Shift + Enter for a new line)" aria-label="Message"></textarea>
          <button class="btn primary" type="submit" data-submit>Send</button>
        </form>
        <p class="muted small" data-ai-hint>Each message uses 1 AI request.</p>
      </div>
    </section>
  </template>

  <!-- Gợi ý từ: the AI suggests new words for a topic and a level, the learner ticks some -->
  <template id="tpl-suggest">
    <section>
      <a class="back" href="#/notebook">← My notebook</a>
      <h1>Suggest words</h1>
      <p class="muted">Choose a topic and level. AI will suggest new words, excluding words already in your notebook. Select the words you want to learn and add them.</p>
      <div data-suggest-body>
        <form class="card form suggest-form" data-form novalidate>
          <div class="grid-2">
            <label>Topic
              <select name="topic_id" data-topic-select></select>
            </label>
            <label>Level
              <select name="level"></select>
            </label>
          </div>
          <p class="muted small hint-line" data-ai-hint></p>
          <div class="ai-panel" data-ai-panel role="status" aria-live="polite" hidden></div>
          <div class="row end">
            <button class="btn primary" type="submit" data-submit>✨ Suggest</button>
          </div>
        </form>
        <ul class="words suggest-list" data-suggestions aria-live="polite"></ul>
        <div class="row center suggest-actions" data-suggest-actions hidden>
          <button class="btn" type="button" data-more>Suggest more</button>
          <button class="btn primary" type="button" data-add disabled>Select words to add</button>
        </div>
      </div>
    </section>
  </template>

  <!-- Đặt câu: the learner writes a sentence with one notebook word, the AI grades it -->
  <template id="tpl-sentence">
    <section class="narrow">
      <a class="back" href="#/notebook">← My notebook</a>
      <h1>Write a sentence</h1>
      <p class="muted">Choose a word from your notebook and write an English sentence with it. AI will grade it, explain errors in Vietnamese, and suggest a corrected sentence.</p>
      <div data-sentence-body>
        <form class="card form" data-form novalidate>
          <div class="row sentence-pick">
            <label class="grow">Word to practice
              <select name="word_id" data-word-select></select>
            </label>
            <button type="button" class="btn" data-random>🎲 Random word</button>
          </div>
          <div class="sentence-word" data-word-card></div>
          <label>Your sentence
            <textarea name="sentence" rows="3" maxlength="300" lang="en" spellcheck="false"></textarea>
          </label>
          <p class="muted small hint-line" data-ai-hint>Click <strong>Grade sentence</strong> or press Ctrl + Enter.</p>
          <div class="ai-panel" data-ai-panel role="status" aria-live="polite" hidden></div>
          <div class="row end">
            <button class="btn primary" type="submit" data-submit>✨ Grade sentence</button>
          </div>
        </form>
        <div class="card sentence-result" data-result aria-live="polite" hidden></div>
      </div>
    </section>
  </template>

  <!-- My progress (each learner sees only their own) -->
  <template id="tpl-progress">
    <section>
      <div class="hero">
        <div>
          <h1>My progress</h1>
          <p class="muted">How you are doing, based on every answer you have checked in Practice.</p>
        </div>
        <div class="hero-actions">
          <a class="btn primary" href="#/review">Practice now</a>
        </div>
      </div>
      <div class="stats" data-progress-stats></div>
      <div class="progress-grid">
        <div class="card">
          <h2>Last 7 days</h2>
          <div class="week" data-week></div>
          <p class="muted legend"><span class="dot ok"></span> correct <span class="dot all"></span> wrong</p>
        </div>
        <div class="card">
          <h2>Words to practice again</h2>
          <p class="muted small">Your last answer for these was wrong.</p>
          <ul class="review-list" data-to-review></ul>
        </div>
      </div>
      <div class="card">
        <h2>By topic</h2>
        <p class="muted small"><span class="dot ok"></span> mastered (last answer right) <span class="dot seen"></span> practiced</p>
        <div class="topic-progress" data-topic-progress></div>
      </div>
    </section>
  </template>

  <!-- Admin: manage the shared words, see learners' progress -->
  <template id="tpl-admin">
    <section>
      <div class="hero">
        <div>
          <h1>Admin</h1>
          <p class="muted">Manage the word bank every learner studies, and follow their progress.</p>
        </div>
        <div class="hero-actions">
          <a class="btn" href="/api/admin/words.csv" download>Export CSV</a>
          <button class="btn" type="button" data-import-open>Import CSV</button>
          <a class="btn primary" href="#/admin/new">+ Add word</a>
        </div>
      </div>

      <div class="card import-card" data-import hidden>
        <div class="row">
          <h2>Import words from a CSV file</h2>
          <button class="btn small ghost" type="button" data-import-close>Close</button>
        </div>
        <p class="muted small">
          UTF-8 CSV whose first line is <code>word,meaning_vi,part_of_speech,example,usage_note,topic</code>.
          Only <code>word</code> and <code>meaning_vi</code> are required; <code>topic</code> is a topic name or slug.
          <a href="/static/words-template.csv" download>Download a template</a>.
        </p>
        <div class="import-controls">
          <input type="file" accept=".csv,text/csv" data-import-file aria-label="CSV file">
          <label class="check"><input type="checkbox" data-import-update> Overwrite words that are already in the bank</label>
        </div>
        <div data-import-result hidden>
          <p class="import-summary" data-import-summary></p>
          <ul class="import-errors" data-import-errors></ul>
          <div class="table-card">
            <table class="table">
              <thead><tr><th>Word</th><th>Meaning</th><th>Topic</th><th>Status</th></tr></thead>
              <tbody data-import-sample></tbody>
            </table>
          </div>
          <div class="row end">
            <button class="btn primary" type="button" data-import-save></button>
          </div>
        </div>
      </div>

      <div class="stats" data-admin-stats></div>
      <div class="tabs admin-tabs" role="tablist">
        <a href="#/admin" data-admin-tab="words">Words</a>
        <a href="#/admin?tab=learners" data-admin-tab="learners">Learners</a>
      </div>

      <div data-admin-words hidden>
        <div class="toolbar">
          <form class="search" data-search role="search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" name="q" placeholder="Search by word or meaning..." aria-label="Search" autocomplete="off">
          </form>
          <select data-admin-topic aria-label="Topic"></select>
        </div>
        <p class="muted count" data-count></p>
        <div class="card table-card">
          <table class="table">
            <thead><tr><th>Word</th><th>Meaning</th><th>Topic</th><th class="hide-sm">Example</th><th></th></tr></thead>
            <tbody data-rows></tbody>
          </table>
        </div>
        <div class="row center"><button class="btn" data-more hidden>Show more</button></div>
      </div>

      <div data-admin-learners hidden>
        <div class="card table-card">
          <table class="table">
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Practiced</th><th>Accuracy</th><th class="hide-sm">Last practice</th><th class="hide-sm">Joined</th></tr></thead>
            <tbody data-learner-rows></tbody>
          </table>
        </div>
      </div>
    </section>
  </template>

  <!-- Quiz generated and graded by the server from the private notebook -->
  <template id="tpl-quiz">
    <section class="narrow" lang="vi">
      <div class="hero">
        <div>
          <h1>Notebook quiz</h1>
          <p class="muted">Multiple choice, fill-in-the-blank, and meaning questions. Answers are shown after you submit.</p>
        </div>
      </div>
      <form class="card row" data-quiz-start>
        <label class="deck-size">Number of questions
          <select data-quiz-count>
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="30">30</option>
          </select>
        </label>
        <button class="btn primary" type="submit">Create quiz</button>
      </form>
      <div data-quiz-area></div>
    </section>
  </template>

  <!-- Spaced repetition, with scheduling computed and saved by the server -->
  <template id="tpl-srs">
    <section class="narrow" lang="vi">
      <div class="hero">
        <div>
          <h1>Review today</h1>
          <p class="muted" data-srs-count>Loading words to review...</p>
        </div>
      </div>
      <div data-srs-card></div>
    </section>
  </template>

  <!-- Practice -->
  <template id="tpl-review">
    <section class="narrow">
      <div class="row">
        <h1>Practice</h1>
      </div>
      <div class="review-settings">
        <label class="deck-size">Topic
          <select data-review-topic-select></select>
        </label>
        <label class="deck-size">Cards
          <select data-size>
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="0">All</option>
          </select>
        </label>
      </div>
      <div class="tabs mode" role="radiogroup" aria-label="Practice direction">
        <button type="button" data-mode="en-vi">🇬🇧 English → Vietnamese 🇻🇳</button>
        <button type="button" data-mode="vi-en">🇻🇳 Vietnamese → English 🇬🇧</button>
      </div>
      <div class="progress" aria-hidden="true"><div class="progress-bar" data-bar></div></div>
      <p class="muted progress-text" data-progress></p>

      <div class="card flash" data-card>
        <div class="flash-top">
          <span class="badge" data-pos></span>
          <button class="icon-btn" data-speak title="Listen" aria-label="Listen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          </button>
        </div>
        <p class="muted prompt-label" data-prompt-label></p>
        <p class="flash-word" data-prompt></p>
        <p class="hint" data-hint hidden></p>

        <form class="answer-form" data-answer-form autocomplete="off">
          <input name="answer" data-input autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="200">
          <button class="btn primary" type="submit" data-check>Check</button>
        </form>
        <div class="row center small-actions" data-before>
          <button type="button" class="btn small ghost" data-hint-btn>Hint</button>
          <button type="button" class="btn small ghost" data-skip>I don't know</button>
        </div>

        <div class="feedback" data-feedback hidden>
          <p class="verdict" data-verdict></p>
          <p class="expected"><span class="muted">Answer:</span> <strong data-expected></strong></p>
          <p class="example" data-example></p>
          <p class="note" data-note></p>
          <div class="row center">
            <button type="button" class="btn small ghost" data-override hidden>I was right</button>
            <button type="button" class="btn primary" data-next>Continue <kbd>Enter</kbd></button>
          </div>
        </div>
      </div>

      <div class="card done" data-done hidden>
        <div class="ring" data-ring><span data-percent></span></div>
        <p class="big">Round complete!</p>
        <p class="muted" data-summary></p>
        <div class="missed" data-missed-box hidden>
          <p class="missed-title">Words to practice again</p>
          <ul data-missed></ul>
        </div>
        <div class="row center">
          <button class="btn primary" data-again>New round</button>
